name: Update Parsers

on:
  push:
    branch: auto_update

jobs:
  update-parsers:
    name: Update
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        tier: [1, 2]
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.4.1
          args: false

      - name: Update parsers
        run: ./scripts/nvim/update-parsers.lua --tier=${{ matrix.tier }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: lua/tree-sitter-manager/repos.lua
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "ops(parsers): update tier ${{ matrix.tier }}\n${{ env.UPDATED_PARSERS }}"
          branch: update-parsers-tier-${{ matrix.tier }}
          base: main
          title: Update Parsers Tier ${{ matrix.tier }}
          body: ${{ env.UPDATED_PARSERS }}
          labels: auto-update
          reviewers: tunaflsh
