name: Update Parsers

on:
  schedule:
    - cron: '30 0 15 * *'
  workflow_dispatch:

jobs:
  update-parsers:
    name: Update
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.4.1
          args: false

      - name: Update Parsers
        run: ./scripts/nvim/update-parsers.lua

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: lua/tree-sitter-manager/repos.lua
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "ops(parsers): update\n${{ env.UPDATED_PARSERS }}"
          branch: auto-update-parsers
          base: main
          title: Update Parsers
          body: ${{ env.UPDATED_PARSERS }}
          labels: auto-update
          reviewers: tunaflsh
